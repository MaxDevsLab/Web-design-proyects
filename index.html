<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <title>Calculadora de Préstamos</title>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .calculator-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .calculator-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .calculator-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        .calculator-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .btn-calculate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .error-message {
            display: none;
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #c33;
        }

        .results-container {
            display: none;
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .results-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-label {
            font-weight: 600;
            color: #666;
        }

        .results-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .input-group-text {
            background: #667eea;
            color: white;
            border: none;
            font-weight: 600;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="calculator-header">
            <h1>Calculadora de Préstamos</h1>
        </div>

        <div class="calculator-body">
            
            <div class="mb-4">
                <label for="monto" class="form-label">Monto del Préstamo</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="monto" placeholder="Ejemplo: 1000000" min="0" step="100">
                    <span class="input-group-text">$</span>
                </div>
            </div>

            <div class="mb-4">
                <label for="interes" class="form-label">Tasa de Interés Anual</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="interes" placeholder="Ejemplo: 24" min="0.1" step="0.1">
                    <span class="input-group-text">%</span>
                </div>
            </div>

            <div class="mb-4">
                <label for="plazo" class="form-label">Plazo</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="plazo" placeholder="Ejemplo: 12" min="1" step="1">
                    <span class="input-group-text">Meses</span>
                </div>
            </div>

            <button class="btn btn-calculate" id="btnCalcular">Calcular Préstamo</button>

            <div class="error-message" id="errorMessage"></div>

            <div class="results-container" id="resultsContainer">
                <div class="results-item">
                    <div class="results-label">Cuota Mensual</div>
                    <div class="results-value" id="cuotaMensual">$0</div>
                </div>

                <div class="results-item">
                    <div class="results-label">Total a Pagar</div>
                    <div class="results-value" id="totalPagar">$0</div>
                </div>

                <div class="results-item">
                    <div class="results-label">Total de Intereses</div>
                    <div class="results-value" id="totalIntereses">$0</div>
                </div>
            </div>

        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    
    <!-- Bootstrap -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript de la calculadora -->
    <script>
        $(document).ready(function(){
            console.log('jQuery cargado correctamente');
            console.log('Script iniciado');

            // Evento click en el botón calcular
            $('#btnCalcular').on('click', function(){
                console.log('Botón clickeado');
                
                // Limpiar mensajes de error previos
                $('#errorMessage').hide().text('');

                // Obtener valores de los campos
                const monto = parseFloat($('#monto').val());
                const tasaAnual = parseFloat($('#interes').val());
                const plazo = parseInt($('#plazo').val());

                console.log('Valores:', {monto, tasaAnual, plazo});

                // Validación de campos
                if(isNaN(monto) || monto <= 0){
                    mostrarError('Por favor ingrese un monto válido mayor a cero');
                    return;
                }

                if(isNaN(tasaAnual) || tasaAnual <= 0){
                    mostrarError('Por favor ingrese una tasa de interés válida mayor a cero');
                    return;
                }

                if(isNaN(plazo) || plazo <= 0){
                    mostrarError('Por favor ingrese un plazo válido mayor a cero');
                    return;
                }

                // Si todo es válido, calcular el préstamo
                calcularPrestamo(monto, tasaAnual, plazo);
            });

            // Función para mostrar mensajes de error
            function mostrarError(mensaje){
                $('#errorMessage').text(mensaje).show();
                $('#resultsContainer').hide();
            }

            // Función para calcular el préstamo
            function calcularPrestamo(monto, tasaAnual, plazo){
                console.log('Calculando préstamo...');
                
                // Convertir tasa anual a tasa mensual decimal
                const tasaMensual = (tasaAnual / 100) / 12;

                let cuotaMensual;

                // Fórmula de cuota mensual
                if (tasaMensual === 0){
                    // Si no hay interés, dividir el monto entre el plazo
                    cuotaMensual = monto / plazo;
                } else {
                    // Fórmula del sistema francés (cuota fija)
                    const numerador = tasaMensual * Math.pow(1 + tasaMensual, plazo);
                    const denominador = Math.pow(1 + tasaMensual, plazo) - 1;
                    cuotaMensual = monto * (numerador / denominador);
                }

                // Calcular totales
                const totalPagar = cuotaMensual * plazo;
                const totalIntereses = totalPagar - monto;

                console.log('Resultados:', {cuotaMensual, totalPagar, totalIntereses});

                // Mostrar los resultados
                $('#cuotaMensual').text('$' + formatearNumero(cuotaMensual));
                $('#totalPagar').text('$' + formatearNumero(totalPagar));
                $('#totalIntereses').text('$' + formatearNumero(totalIntereses));

                // Mostrar el contenedor de resultados con animación
                $('#resultsContainer').slideDown('slow');
            }

            // Función para formatear números con separador de miles y decimales
            function formatearNumero(numero){
                if(isNaN(numero) || numero === null || numero === undefined){
                    return '0.00';
                }
                // Formato con 2 decimales y separador de miles
                return numero.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }

            // Permitir calcular presionando Enter en cualquier campo
            $('.form-control').on('keypress', function(e){
                if(e.which === 13) { // 13 es el código de la tecla Enter
                    $('#btnCalcular').click();
                }
            });

        });
    </script>

</body>
</html>
