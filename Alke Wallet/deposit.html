<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar - Alke Wallet</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="menu.html">💰 Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="menu.html">Volver al Menú</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="login.html">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header text-white">
                        <h4 class="mb-0">💵 Depositar Fondos</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Saldo Actual -->
                        <div class="alert alert-info">
                            <strong>Saldo actual:</strong> <span id="currentBalance">$10,000.00</span>
                        </div>

                        <!-- Formulario de Depósito -->
                        <form id="depositForm">
                            <div class="mb-3">
                                <label for="depositAmount" class="form-label">Monto a depositar</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="depositAmount" 
                                           placeholder="0.00" min="1" step="0.01" required>
                                </div>
                                <small class="form-text text-muted">Monto mínimo: $1.00</small>
                            </div>

                            <div class="mb-3">
                                <label for="depositMethod" class="form-label">Método de depósito</label>
                                <select class="form-select" id="depositMethod" required>
                                    <option value="">Selecciona un método</option>
                                    <option value="transferencia">Transferencia bancaria</option>
                                    <option value="tarjeta">Tarjeta de débito</option>
                                    <option value="efectivo">Efectivo</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="depositDescription" class="form-label">Descripción (opcional)</label>
                                <textarea class="form-control" id="depositDescription" 
                                          rows="3" placeholder="Ej: Depósito mensual"></textarea>
                            </div>

                            <!-- Mensaje de éxito -->
                            <div class="alert alert-success d-none" id="successMessage" role="alert">
                                <strong>¡Depósito realizado con éxito!</strong>
                                <p class="mb-0">Tu nuevo saldo es: <span id="newBalance"></span></p>
                            </div>

                            <!-- Mensaje de error -->
                            <div class="alert alert-danger d-none" id="errorMessage" role="alert">
                                Por favor, completa todos los campos correctamente.
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Realizar Depósito
                                </button>
                                <a href="menu.html" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Montos sugeridos -->
                <div class="card mt-3 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Montos sugeridos</h6>
                        <div class="d-grid gap-2 d-md-flex">
                            <button class="btn btn-outline-primary quick-amount" data-amount="100">$100</button>
                            <button class="btn btn-outline-primary quick-amount" data-amount="500">$500</button>
                            <button class="btn btn-outline-primary quick-amount" data-amount="1000">$1,000</button>
                            <button class="btn btn-outline-primary quick-amount" data-amount="5000">$5,000</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script personalizado -->
    <script src="js/deposit.js"></script>
</body>
</html>
