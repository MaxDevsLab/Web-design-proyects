<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Alke Wallet</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-background">
    <video autoplay muted loop playsinline class="bg-video">
    <source src="Assets/dataparticles.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold" id="h-login">💰 Alke Wallet</h2>
                            <p class="text-muted">Inicia sesión en tu cuenta</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="username" 
                                       placeholder="Ingresa tu usuario" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" 
                                       placeholder="Ingresa tu contraseña" required>
                            </div>

                            <div class="alert alert-danger d-none" id="errorMessage" role="alert">
                                Usuario o contraseña incorrectos
                            </div>

                            <div class="alert alert-info" role="alert">
                                <small>
                                    <strong>Usuario de prueba:</strong> admin<br>
                                    <strong>Contraseña:</strong> 1234
                                </small>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                Ingresar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script personalizado -->
    <script src="js/login.js"></script>
</body>
</html>
